[package]
name = "axum-starter"
version = "0.1.0"
edition = "2021"
description = "Axum HTTP API starter scaffolded with create-rust-app"
license = "MIT"

[[bin]]
name = "axum-starter"
path = "src/main.rs"

[lib]
name = "axum_starter"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
