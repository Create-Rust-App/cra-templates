services:
  api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      API_PREFIX: "${API_PREFIX:-/api/v1}"
      RUST_LOG: "axum_starter=debug,tower_http=debug"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
